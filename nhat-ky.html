<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Tạp Hóa — Nhật ký hoạt động</title>
<link rel="stylesheet" href="style.css?v=20260828o">
</head>
<body>

<!-- Đăng nhập / sidebar / topbar được render bằng JS trong app.js (renderLogin/renderShell) — dùng
     chung cho mọi trang, sửa menu chỉ cần sửa 1 chỗ trong app.js, không phải sửa lại từng file -->
<div id="login-mount"></div>
<div id="mnu-backdrop" onclick="closeMenu()"></div>
<div id="sb" style="display:none"></div>
<div id="main" style="display:none">
  <div id="topbar"></div>
  <div id="content">

    <div class="sec on" id="s-log">
      <p style="font-size:12px;color:var(--text2);margin-bottom:14px">Nhật ký tự động xóa sau <b>30 ngày</b> để đỡ nặng dữ liệu — chỉ giữ lại lịch sử gần đây.</p>
      <details class="sb-wrap">
      <summary class="sb-toggle">🔍 Tìm kiếm &amp; lọc</summary>
      <div class="sb">
        <input type="text" id="q-log" placeholder="Tìm người dùng, chi tiết..." oninput="fLog()">
        <div class="date-range">
          <label style="font-size:12px;color:var(--text2);white-space:nowrap">Từ</label>
          <input type="date" id="from-log" onchange="fLog()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#fff">
          <label style="font-size:12px;color:var(--text2);white-space:nowrap">Đến</label>
          <input type="date" id="to-log" onchange="fLog()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#fff">
        </div>
        <select id="act-log" onchange="fLog()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;outline:none">
          <option value="">Tất cả hành động</option>
          <option value="Tạo mới">Tạo mới</option>
          <option value="Cập nhật">Cập nhật</option>
          <option value="Xóa">Xóa</option>
        </select>
        <select id="obj-log" onchange="fLog()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;outline:none">
          <option value="">Tất cả đối tượng</option>
          <option value="Tồn kho">Tồn kho</option>
          <option value="Nhập hàng">Nhập hàng</option>
          <option value="Xếp hàng">Xếp hàng</option>
          <option value="Đồ gian hàng">Đồ gian hàng</option>
        </select>
        <select id="pg-log" onchange="fLog()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;outline:none">
          <option value="50">50 dòng</option>
          <option value="100">100 dòng</option>
          <option value="200">200 dòng</option>
          <option value="0">Tất cả</option>
        </select>
        <button class="btn btn-g" onclick="document.getElementById('q-log').value='';document.getElementById('from-log').value='';document.getElementById('to-log').value='';document.getElementById('act-log').value='';document.getElementById('obj-log').value='';fLog()">✕</button>
        <button class="btn btn-g" onclick="loadLog()">↻ Làm mới</button>
      </div>
      </details>
      <div class="card"><div class="ch"><h2>Nhật ký hoạt động</h2></div><div id="log-tbl"><div class="ld"><div class="spin"></div></div></div></div>
    </div>
  </div>
</div>


<div id="toast"></div>
<script src="app.js?v=20260828o"></script>
<script>
// ── JS riêng cho màn Nhật ký hoạt động ──
function fmtDT(iso){
  if(!iso)return'';
  const d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
async function loadLog(){
  document.getElementById('log-tbl').innerHTML='<div class="ld"><div class="spin"></div></div>';
  await ensureUser();// cần để tra tên hiển thị từ email đăng nhập ghi trong nhật ký
  const data=await apiGet('Log');
  C.LOG=[...data].reverse();// mới nhất lên đầu
  fLog();
}
const LOG_ACT_BG={'Tạo mới':'bg-g','Cập nhật':'bg-b','Xóa':'bg-r'};
function fLog(){
  const q=document.getElementById('q-log').value.toLowerCase();
  const from=document.getElementById('from-log').value;
  const to=document.getElementById('to-log').value;
  const act=document.getElementById('act-log').value;
  const obj=document.getElementById('obj-log').value;
  const pg=Number(document.getElementById('pg-log').value);
  let d=C.LOG.filter(r=>{
    const ngay=(r[0]||'').slice(0,10);
    if(from&&ngay<from)return false;
    if(to&&ngay>to)return false;
    if(act&&r[2]!==act)return false;
    if(obj&&r[3]!==obj)return false;
    const ten=(findUserByEmail(r[1])||[])[0]||'';
    if(q&&!((r[1]||'').toLowerCase().includes(q)||ten.toLowerCase().includes(q)||(r[4]||'').toLowerCase().includes(q)))return false;
    return true;
  });
  if(pg>0)d=d.slice(0,pg);
  rLog(d);
}
function rLog(data){
  const el=document.getElementById('log-tbl');
  if(!data.length){el.innerHTML='<div class="empty">📜 Chưa có nhật ký hoạt động</div>';return;}
  el.innerHTML='<table class="m-tbl"><thead><tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody>'+
    data.map(r=>{
      const rec=findUserByEmail(r[1]);
      const who=rec?`${rec[0]}<br><small style="opacity:.75">${esc(r[1]||'')}</small>`:esc(r[1]||'');
      return`<tr><td data-label="Thời gian">${fmtDT(r[0])}</td><td data-label="Người dùng"><span class="bg bg-p">${who}</span></td><td class="mobile-hide" data-label="Hành động"><span class="bg ${LOG_ACT_BG[r[2]]||'bg-b'}">${r[2]||''}</span></td><td data-label="Đối tượng">${r[3]||''}</td><td class="mobile-hide" data-label="Chi tiết">${esc(r[4]||'')}</td></tr>`;
    }).join('')+
    '</tbody></table>';
}

// ── INIT ──

bootPage('log',function(){
  document.getElementById('acts').innerHTML=`<button class="btn btn-g" onclick="loadLog()">↻ Làm mới</button>`;
  loadLog();
});
</script>
</body>
</html>
