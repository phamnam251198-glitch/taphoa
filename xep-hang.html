<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Quản Lý Tạp Hóa — Xếp hàng</title>
<link rel="stylesheet" href="style.css?v=20260901bg">
</head>
<body>

<!-- Đăng nhập / sidebar / topbar được render bằng JS trong app.js (renderLogin/renderShell) — dùng
     chung cho mọi trang, sửa menu chỉ cần sửa 1 chỗ trong app.js, không phải sửa lại từng file -->
<div id="login-mount"></div>
<div id="mnu-backdrop" onclick="closeMenu()"></div>
<div id="sb" style="display:none"></div>
<div id="main" style="display:none">
  <div id="topbar"></div>
  <div id="content">

    <div class="sec on" id="s-xh">
      <details class="sb-wrap">
      <summary class="sb-toggle">🔍 Tìm kiếm &amp; lọc</summary>
      <div class="sb">
        <input type="text" id="q-xh" placeholder="Tìm sản phẩm, gian hàng..." oninput="fXH()">
        <div class="date-range">
          <label style="font-size:12px;color:var(--text2);white-space:nowrap">Từ</label>
          <input type="date" id="from-xh" onchange="fXH()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#fff">
          <label style="font-size:12px;color:var(--text2);white-space:nowrap">Đến</label>
          <input type="date" id="to-xh" onchange="fXH()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#fff">
        </div>
        <button class="btn btn-g" onclick="document.getElementById('from-xh').value='';document.getElementById('to-xh').value='';document.getElementById('dm-xh').value='';fXH()">✕</button>
        <select id="dm-xh" onchange="fXH()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;outline:none">
          <option value="">Tất cả các tháng</option>
        </select>
        <select id="pg-xh" onchange="fXH()" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;outline:none">
          <option value="30">30 ngày</option>
          <option value="50">50 ngày</option>
          <option value="100">100 ngày</option>
          <option value="0">Tất cả</option>
        </select>
        <button class="btn btn-d" id="xh-delsel-btn" onclick="delSelXH()" style="display:none">Xóa (<span id="xh-selcnt">0</span>)</button>
      </div>
      </details>
      <div id="xh-sum"></div>
      <div class="card"><div class="ch"><h2>Lịch sử xếp hàng</h2></div><div id="xh-tbl"><div class="ld"><div class="spin"></div></div></div></div>
    </div>
  </div>
</div>

<!-- MODAL XẾP HÀNG NHIỀU DÒNG -->
<div class="mo" id="m-xh">
  <div class="mb">
    <button class="modal-x" onclick="cm('m-xh')" aria-label="Đóng">✕</button>
    <h3 style="padding-right:28px">Tạo phiếu xếp hàng</h3>
    <div class="fr">
      <div class="fg"><label>Gian hàng *</label><select id="xh-gh"><option value="">-- Chọn --</option></select></div>
      <div class="fg"><label>Ngày xếp hàng</label><input id="xh-ngay" type="date"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Ghi chú</label><input id="xh-gc" placeholder="Ghi chú thêm..."></div>
      <div class="fg"><label>Tháng danh mục *</label><select id="xh-dm"><option value="">-- Chọn tháng --</option></select></div>
    </div>
    <label style="font-size:11px;color:var(--text2);font-weight:500;display:block;margin-bottom:6px">Danh sách hàng xếp *</label>
    <table class="item-table">
      <thead><tr><th>Sản phẩm</th><th>Tồn kho</th><th>Số lượng</th><th></th></tr></thead>
      <tbody id="xh-rows"></tbody>
    </table>
    <button class="add-row-btn" onclick="addXHRow()">+ Thêm sản phẩm</button>
    <div class="total-bar">
      <span>Tổng SL: <b id="xh-tsl">0</b></span>
    </div>
    <div class="mf">
      <button class="btn btn-s" onclick="saveXH()">Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL CHI TIẾT XẾP HÀNG THEO NGÀY -->
<div class="mo" id="m-xh-day">
  <div class="mb mb-lg">
    <button class="modal-x" onclick="cm('m-xh-day')" aria-label="Đóng">✕</button>
    <h3 id="xh-day-t" style="padding-right:28px">Phiếu xếp hàng ngày ...</h3>
    <div class="fr">
      <div class="fg"><label>Tìm nhanh trong phiếu</label><input type="text" id="xh-day-q" placeholder="🔍 lọc theo tên SP, gian hàng..." oninput="renderXHDayDetail()"></div>
      <div class="fg"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Ngày xếp hàng</label><input type="date" id="xhd-h-ngay"></div>
      <div class="fg"><label>Tháng danh mục</label><select id="xhd-h-dm"><option value="">— giữ nguyên từng dòng —</option></select></div>
    </div>
    <label style="font-size:11px;color:var(--text2);font-weight:500;display:block;margin:4px 0 6px">Danh sách hàng xếp trong ngày *</label>
    <div id="xh-day-tbl"></div>
    <button class="add-row-btn" onclick="addXHDayRow()">+ Thêm sản phẩm</button>
    <div class="total-bar" id="xh-day-total" style="display:none"></div>
    <div class="mf">
      <button class="btn btn-d" style="margin-right:auto" onclick="delXHDay()">Xóa</button>
      <button class="btn btn-p" onclick="saveXHDayAll()">Lưu</button>
    </div>
  </div>
</div>

<!-- POPUP: các ngày xếp trong 1 THÁNG DANH MỤC (bấm 1 tháng ở danh sách chính) -->
<div class="mo" id="m-xh-month">
  <div class="mb mb-lg">
    <button class="modal-x" onclick="cm('m-xh-month')" aria-label="Đóng">✕</button>
    <h3 id="xh-month-t" style="padding-right:28px">Xếp hàng — ...</h3>
    <div id="xh-month-sum" style="font-size:12px;color:var(--text2);margin-bottom:10px"></div>
    <div id="xh-month-body"></div>
    <div style="font-size:11px;color:var(--text2);margin-top:8px">Bấm 1 ngày để sửa phiếu xếp của ngày đó.</div>
  </div>
</div>

<div id="toast"></div>
<script src="app.js?v=20260901bg"></script>
<script>
// ── JS riêng cho màn Xếp hàng ──
let xhRowCount=0;
function addXHRow(){
  xhRowCount++;const id=xhRowCount;
  const tr=document.createElement('tr');tr.id='xh-r-'+id;
  tr.innerHTML=`<td><input id="xh-sp-${id}" autocomplete="off" placeholder="Gõ tên sản phẩm..." oninput="xhFillTon(${id})" style="min-width:150px"></td>
    <td id="xh-ton-${id}" style="text-align:center;color:var(--text2);font-size:12px;white-space:nowrap">—</td>
    <td><input type="number" min="0" id="xh-sl-${id}" placeholder="0" oninput="calcXH()" style="width:90px"></td>
    <td class="td-del"><button class="btn btn-d btn-sm" onclick="removeRowEl(document.getElementById('xh-r-${id}'));calcXH()">✕</button></td>`;
  document.getElementById('xh-rows').appendChild(tr);
  attachSearchList(document.getElementById('xh-sp-'+id),()=>C.TK.map(t=>t[0]));
}
// Hiện tồn kho hiện có của SP đang chọn + cảnh báo nếu xếp vượt tồn
function xhFillTon(id){
  const spEl=document.getElementById('xh-sp-'+id),cell=document.getElementById('xh-ton-'+id);
  if(!spEl||!cell)return;
  const sp=C.TK.find(t=>t[0]===spEl.value.trim());
  if(sp){
    const t=Number(sp[1]||0);
    cell.innerHTML=`<b style="color:${t<=0?'#d03b3b':'var(--text)'}">${fmt(t)}</b>`;
    const slEl=document.getElementById('xh-sl-'+id);if(slEl)slEl.max=t;
  }else cell.textContent='—';
  calcXH();
}
function calcXH(){
  let tsl=0;
  document.getElementById('xh-rows').querySelectorAll('tr').forEach(tr=>{
    const id=tr.id.replace('xh-r-','');
    const slEl=document.getElementById('xh-sl-'+id);
    const sl=Number(slEl?.value||0);
    tsl+=sl;
    // tô đỏ ô Số lượng khi xếp vượt tồn kho của SP đó
    const sp=C.TK.find(t=>t[0]===(document.getElementById('xh-sp-'+id)?.value||'').trim());
    if(slEl)slEl.style.background=(sp&&sl>Number(sp[1]||0))?'#f5b0b0':'';
  });
  document.getElementById('xh-tsl').textContent=fmt(tsl);
}
async function openXH(){
  await ensureTK();
  await ensureGH();
  if(!C.GH.length){toast('Chưa có gian hàng nào, vào mục Gian hàng để thêm trước','err');return;}
  document.getElementById('xh-gh').innerHTML='<option value="">-- Chọn --</option>'+C.GH.map(r=>`<option>${r[0]}</option>`).join('');
  dmFillSelect(document.getElementById('xh-dm'),dmNow());// mặc định tháng hiện tại
  document.getElementById('xh-ngay').value=td();
  document.getElementById('xh-gc').value='';
  cleanupSearchLists(document.getElementById('xh-rows'));
  document.getElementById('xh-rows').innerHTML='';xhRowCount=0;
  addXHRow();calcXH();om('m-xh');
}
async function saveXH(){
  const gh=document.getElementById('xh-gh').value;
  const ngay=document.getElementById('xh-ngay').value;
  const gc=document.getElementById('xh-gc').value;
  const rows=document.getElementById('xh-rows').querySelectorAll('tr');
  const items=[];
  rows.forEach(tr=>{
    const id=tr.id.replace('xh-r-','');
    const spVal=document.getElementById('xh-sp-'+id)?.value||'';
    const idx=C.TK.findIndex(t=>t[0]===spVal);
    const sl=Number(document.getElementById('xh-sl-'+id)?.value||0);
    if(idx>=0&&sl>0)items.push({idx,sp:C.TK[idx],sl});
  });
  const dm=document.getElementById('xh-dm').value;
  if(!gh){toast('Chọn gian hàng','err');return;}
  if(!dm){toast('Chọn tháng danh mục','err');return;}
  if(!items.length){toast('Thêm ít nhất 1 sản phẩm','err');return;}
  // Kiểm tra tồn, không cho xếp vượt quá tồn kho hiện có
  for(const it of items){
    if(it.sl>Number(it.sp[1]||0)){toast(`${it.sp[0]}: tồn chỉ còn ${it.sp[1]}!`,'err');return;}
  }
  toast('Đang lưu '+items.length+' sản phẩm...');
  for(const it of items){
    await apiPost({sheet:'XepHang',action:'append',row:[it.sp[0],it.sl,gh,ngay,gc,it.sp[9]||'',dm]});
    const newSL=Math.max(0,Number(it.sp[1]||0)-it.sl);const upd=[...it.sp];upd[1]=newSL;// không để tồn âm
    await apiPost({sheet:'TonKho',action:'update',row:it.idx+2,data:upd});
    C.TK[it.idx][1]=newSL;
  }
  logAction('Tạo mới','Xếp hàng',`Gian hàng: ${gh} — ${items.map(it=>`${it.sp[0]} x${it.sl}`).join(', ')}`);
  toast('Đã xếp '+items.length+' sản phẩm!');cm('m-xh');setTimeout(loadXH,800);
}

let selXH=new Set();
// Danh sách Xếp hàng hiển thị GỘP THEO NGÀY (mỗi ngày 1 dòng) — bấm vào xem/sửa chi tiết từng dòng
// xếp của ngày đó trong popup, giống cách đã làm ở Nhập hàng
function groupXHByDate(data){
  const map=new Map();
  data.forEach(r=>{
    const ngay=r[3]||'(chưa có ngày)';
    if(!map.has(ngay))map.set(ngay,[]);
    map.get(ngay).push(r);
  });
  return[...map.entries()].map(([ngay,items])=>({
    ngay,items,
    soSP:new Set(items.map(r=>r[0])).size,
    tongSL:items.reduce((s,r)=>s+Number(r[1]||0),0),
    gianHang:[...new Set(items.map(r=>r[2]).filter(Boolean))]
  }));
}
async function loadXH(){
  document.getElementById('xh-tbl').innerHTML='<div class="ld"><div class="spin"></div></div>';
  selXH.clear();updateSelUI('xh-delsel-btn','xh-selcnt',0);
  const data=await apiGet('XepHang');C.XH=data;
  await dmHealSheet('XepHang',data,6,3);// dọn danhMucId cũ dạng "DM..." → "YYYY-MM" theo ngày xếp
  const dmSel=document.getElementById('dm-xh');
  if(dmSel){
    const cur=dmSel.value;
    dmSel.innerHTML='<option value="">Tất cả các tháng</option>'+dmFilterMonths(data.map(r=>r[6])).map(m=>`<option value="${m}"${m===cur?' selected':''}>${dmFmt(m)}</option>`).join('');
  }
  rXH(groupXHByDate(data).sort((a,b)=>(b.ngay||'').localeCompare(a.ngay||'')));
  // Không tự vẽ lại popup nếu đang có dòng mới chưa lưu (bấm "+ Thêm") — tránh mất trắng nội dung đang gõ dở
  if(xhDayCurrent&&document.getElementById('m-xh-day').classList.contains('on')&&!document.querySelector('#xh-day-tbl tr[data-new="1"]'))renderXHDayDetail();
}
const XH_COLS=[
  {key:'ngay',label:'Ngày xếp'},{key:'sosp',label:'Số sản phẩm'},{key:'tongsl',label:'Tổng SL'},{key:'gh',label:'Gian hàng'}
];
let xhSortCol=null,xhSortDir=1;
function sortXHClick(col){if(xhSortCol===col)xhSortDir*=-1;else{xhSortCol=col;xhSortDir=1;}fXH();}
function xhCompare(a,b,col){
  switch(col){
    case'sosp':return a.soSP-b.soSP;
    case'tongsl':return a.tongSL-b.tongSL;
    case'gh':return a.gianHang.join(',').localeCompare(b.gianHang.join(','));
    default:return(a.ngay||'').localeCompare(b.ngay||'');
  }
}
function rXH(groups){
  const flat=groups.flatMap(g=>g.items);
  document.getElementById('xh-sum').innerHTML=flat.length?`<div class="grid3 stat-grid3" style="margin-bottom:16px">
    <div class="kpi b"><div class="lb">Số ngày xếp</div><div class="val">${groups.length}</div></div>
    <div class="kpi p"><div class="lb">Tổng SL đã xếp</div><div class="val">${fmt(flat.reduce((s,r)=>s+Number(r[1]||0),0))}</div></div>
    <div class="kpi g"><div class="lb">Số gian hàng</div><div class="val">${new Set(flat.map(r=>r[2]).filter(Boolean)).size}</div></div></div>`:'';
  const el=document.getElementById('xh-tbl');
  if(!groups.length){el.innerHTML='<div class="empty">🏷️ Chưa có phiếu xếp hàng</div>';return;}
  // ── DANH SÁCH THEO THÁNG DANH MỤC — bấm 1 tháng → popup các ngày xếp của tháng đó ──
  const byM=new Map();
  groups.forEach(g=>g.items.forEach(r=>{
    const m=r[6]||'(chưa gắn tháng)';
    if(!byM.has(m))byM.set(m,{items:[],days:new Set(),gh:new Set()});
    const e=byM.get(m);e.items.push(r);e.days.add(r[3]||'(chưa có ngày)');if(r[2])e.gh.add(r[2]);
  }));
  xhMonthMap=byM;
  const mRows=[...byM.entries()].map(([m,e])=>({
    m,nDay:e.days.size,
    soSP:new Set(e.items.map(r=>r[0])).size,
    tongSL:e.items.reduce((s,r)=>s+Number(r[1]||0),0),
    gh:[...e.gh]
  })).sort((a,b)=>(b.m||'').localeCompare(a.m||''));
  el.innerHTML=`<table class="m-tbl"><thead><tr><th>Tháng danh mục</th><th>Số ngày xếp</th><th>Số SP</th><th>Tổng SL</th><th class="mobile-hide">Gian hàng</th></tr></thead><tbody>`+
    mRows.map(x=>`<tr class="row-edit" onclick="openXHMonth('${esc(x.m)}')" title="Bấm để xem các ngày xếp trong tháng này"><td data-label="Tháng danh mục"><span class="bg bg-b">${/^\d{4}-\d{2}$/.test(x.m)?esc(dmFmt(x.m)):esc(x.m)}</span></td><td data-label="Số ngày xếp">${x.nDay}</td><td data-label="Số SP">${x.soSP}</td><td data-label="Tổng SL">${fmt(x.tongSL)}</td><td class="mobile-hide" data-label="Gian hàng">${x.gh.map(n=>`<span class="bg bg-p">${esc(n)}</span>`).join(' ')}</td></tr>`).join('')+
    '</tbody></table>';
  updateSelUI('xh-delsel-btn','xh-selcnt',selXH.size);
}
let xhMonthMap=new Map();
// Bấm 1 THÁNG DANH MỤC → popup: các NGÀY xếp trong tháng đó (bấm 1 ngày → sửa phiếu ngày đó)
function openXHMonth(m){
  const e=xhMonthMap.get(m);if(!e)return;
  const days=groupXHByDate(e.items).sort((a,b)=>(b.ngay||'').localeCompare(a.ngay||''));
  document.getElementById('xh-month-t').textContent='Xếp hàng — '+(/^\d{4}-\d{2}$/.test(m)?dmFmt(m):m);
  const tSL=e.items.reduce((s,r)=>s+Number(r[1]||0),0);
  document.getElementById('xh-month-sum').textContent=`${days.length} ngày · ${new Set(e.items.map(r=>r[0])).size} SP · Tổng SL ${fmt(tSL)} · ${e.gh.size} gian hàng`;
  document.getElementById('xh-month-body').innerHTML=`<button class="btn btn-d btn-sm" id="xh-month-delsel" onclick="delSelXH()" style="display:none;margin-bottom:8px">Xóa ngày đã chọn (<span id="xh-month-selcnt">0</span>)</button>
    <div class="scroll-tbl"><table class="m-tbl"><thead><tr><th style="width:30px"><input type="checkbox" id="xh-selall" onchange="toggleAllXH(this)"></th><th>Ngày xếp</th><th>Số SP</th><th>Tổng SL</th><th class="mobile-hide">Gian hàng</th></tr></thead><tbody>`+
    days.map(g=>{
      const chk=selXH.has(g.ngay)?'checked':'';
      return`<tr style="cursor:pointer" onclick="cm('m-xh-month');openXHDay('${esc(g.ngay)}')"><td data-label="" onclick="event.stopPropagation()"><input type="checkbox" class="xh-chk" data-ngay="${esc(g.ngay)}" ${chk} onchange="toggleXHChk(this)"></td><td data-label="Ngày xếp"><b>${esc(dVN(g.ngay))}</b></td><td data-label="Số SP">${g.soSP}</td><td data-label="Tổng SL">${fmt(g.tongSL)}</td><td class="mobile-hide" data-label="Gian hàng">${g.gianHang.map(n=>`<span class="bg bg-p">${esc(n)}</span>`).join(' ')}</td></tr>`;
    }).join('')+'</tbody></table></div>';
  updateSelUI('xh-month-delsel','xh-month-selcnt',selXH.size);
  updateXHSelAllTri();
  om('m-xh-month');
}
// selXH giờ chứa các NGÀY được chọn (không phải index dòng) — như đã làm ở Nhập hàng
function updateXHSelAllTri(){
  const all=document.getElementById('xh-selall');
  if(!all)return;
  const chks=[...document.querySelectorAll('.xh-chk')];
  const checkedCnt=chks.filter(c=>selXH.has(c.dataset.ngay)).length;
  all.checked=chks.length>0&&checkedCnt===chks.length;
  all.indeterminate=checkedCnt>0&&checkedCnt<chks.length;
}
function xhSyncSelBtns(){
  updateSelUI('xh-delsel-btn','xh-selcnt',selXH.size);
  if(document.getElementById('xh-month-delsel'))updateSelUI('xh-month-delsel','xh-month-selcnt',selXH.size);
}
function toggleXHChk(el){
  const ngay=el.dataset.ngay;
  if(el.checked)selXH.add(ngay);else selXH.delete(ngay);
  xhSyncSelBtns();
  updateXHSelAllTri();
}
function toggleAllXH(el){
  document.querySelectorAll('.xh-chk').forEach(c=>{
    c.checked=el.checked;
    const ngay=c.dataset.ngay;
    if(el.checked)selXH.add(ngay);else selXH.delete(ngay);
  });
  xhSyncSelBtns();
}
async function delSelXH(){
  if(!selXH.size){toast('Chưa chọn ngày nào','err');return;}
  const days=[...selXH];
  const items=C.XH.map((r,i)=>[r,i]).filter(([r])=>days.includes(r[3]||'(chưa có ngày)'));
  if(!items.length){toast('Không tìm thấy phiếu nào','err');return;}
  confirmDel(`Xóa toàn bộ phiếu xếp của ${days.length} ngày đã chọn (${items.length} dòng)? Tồn kho sẽ được hoàn lại tương ứng.`,async()=>{
    toast('Đang xóa '+items.length+' dòng...');
    const idxs=items.map(([,i])=>i).sort((a,b)=>b-a);
    const delNames=[];
    for(const idx of idxs){
      const r=C.XH[idx];if(!r)continue;
      delNames.push(`${r[0]} x${r[1]}`);
      await apiPost({sheet:'XepHang',action:'delete',row:idx+2});
      const spIdx=xhTKIndex(r);
      if(spIdx>=0){
        const newSL=Number(C.TK[spIdx][1]||0)+Number(r[1]||0);
        const upd=[...C.TK[spIdx]];upd[1]=newSL;
        await apiPost({sheet:'TonKho',action:'update',row:spIdx+2,data:upd});
        C.TK[spIdx][1]=newSL;
      }
    }
    logAction('Xóa','Xếp hàng',`Xóa hàng loạt ${days.length} ngày (${delNames.length} dòng): ${delNames.join(', ')}`);
    selXH.clear();
    cm('m-xh-month');
    toast('Đã xóa '+idxs.length+' dòng xếp!');setTimeout(loadXH,800);
  });
}
function fXH(){
  const q=document.getElementById('q-xh').value.toLowerCase();
  const from=document.getElementById('from-xh').value;
  const to=document.getElementById('to-xh').value;
  const dm=document.getElementById('dm-xh')?.value||'';
  const pg=Number(document.getElementById('pg-xh').value);
  let d=[...C.XH];
  if(from)d=d.filter(r=>r[3]>=from);
  if(to)d=d.filter(r=>r[3]<=to);
  if(dm)d=d.filter(r=>(r[6]||'')===dm);
  if(q)d=d.filter(r=>(r[0]||'').toLowerCase().includes(q)||(r[2]||'').toLowerCase().includes(q));
  let groups=groupXHByDate(d);
  if(xhSortCol)groups.sort((a,b)=>xhCompare(a,b,xhSortCol)*xhSortDir);
  else groups.sort((a,b)=>(b.ngay||'').localeCompare(a.ngay||''));
  if(pg>0)groups=groups.slice(0,pg);// pg giờ giới hạn theo số NGÀY, không phải số dòng
  rXH(groups);
}
// Lõi dùng chung để sửa 1 dòng Xếp hàng (dùng cho popup sửa nhanh theo ngày)
async function saveXHEditCore(row,spIdx,sl,gh,ngay,gc,dm){
  const old=C.XH[row-2];if(!old)return{ok:false,msg:'Không tìm thấy phiếu xếp hàng'};
  const sp=C.TK[spIdx];
  if(!sp)return{ok:false,msg:'Chọn sản phẩm'};
  if(!sl||sl<=0)return{ok:false,msg:'Số lượng phải lớn hơn 0'};
  if(!gh)return{ok:false,msg:'Chọn gian hàng'};
  const dmv=dm||old[6]||'';// giữ tháng DM cũ nếu ô để trống
  const oldIdx=xhTKIndex(old);
  const oldSL=Number(old[1]||0);
  // Kiểm tra tồn khả dụng (cộng hoàn lại phần phiếu cũ đã trừ trước khi so sánh)
  if(oldIdx>=0&&oldIdx===spIdx){
    const available=Number(C.TK[spIdx][1]||0)+oldSL;
    if(sl>available)return{ok:false,msg:`${sp[0]}: tồn chỉ còn ${available}!`};
  } else if(sl>Number(sp[1]||0)){
    return{ok:false,msg:`${sp[0]}: tồn chỉ còn ${sp[1]}!`};
  }
  await apiPost({sheet:'XepHang',action:'update',row,data:[sp[0],sl,gh,ngay,gc,sp[9]||'',dmv]});
  // đồng bộ ngay vào cache C.XH — tránh trường hợp sửa lại CÙNG dòng này lần nữa trước khi loadXH()
  // kịp tải lại, khiến "SL cũ" đọc được bị lỗi thời và tồn kho bị tính sai
  C.XH[row-2]=[sp[0],sl,gh,ngay,gc,sp[9]||'',dmv];
  if(oldIdx>=0&&oldIdx===spIdx){
    const newStock=Math.max(0,Number(C.TK[spIdx][1]||0)+oldSL-sl);
    const upd=[...C.TK[spIdx]];upd[1]=newStock;
    await apiPost({sheet:'TonKho',action:'update',row:spIdx+2,data:upd});
    C.TK[spIdx][1]=newStock;
  } else {
    if(oldIdx>=0){
      const newStockOld=Number(C.TK[oldIdx][1]||0)+oldSL;
      const updOld=[...C.TK[oldIdx]];updOld[1]=newStockOld;
      await apiPost({sheet:'TonKho',action:'update',row:oldIdx+2,data:updOld});
      C.TK[oldIdx][1]=newStockOld;
    }
    const newStockNew=Math.max(0,Number(C.TK[spIdx][1]||0)-sl);
    const updNew=[...C.TK[spIdx]];updNew[1]=newStockNew;
    await apiPost({sheet:'TonKho',action:'update',row:spIdx+2,data:updNew});
    C.TK[spIdx][1]=newStockNew;
  }
  // (Không cần tự tay cập nhật "Đồ gian hàng" — màn đó tính thẳng từ lịch sử Xếp hàng mỗi lần hiển thị)
  logAction('Cập nhật','Xếp hàng',`"${old[0]}" SL ${old[1]}→${sl}, Gian hàng: ${gh}`);
  return{ok:true};
}
// ── Popup chi tiết + sửa nhanh các dòng xếp hàng của 1 ngày ──
let xhDayCurrent=null;
async function openXHDay(ngay){
  xhDayCurrent=ngay;
  await ensureTK();
  await ensureGH();
  document.getElementById('xh-day-q').value='';
  xhDayFillHeader(C.XH.filter(r=>(r[3]||'(chưa có ngày)')===ngay));
  renderXHDayDetail();

}
// 2 ô "áp cho mọi dòng" còn lại ở đầu popup (Ngày xếp hàng, Tháng danh mục): mọi dòng cùng giá trị → điền sẵn.
// (Đã bỏ "Gian hàng" và "Ghi chú" khỏi đây — để giá trị quên xóa sẽ vô tình ghi đè MỌI dòng khi Lưu, kể cả
// các dòng khác nhóm đang gộp hiển thị riêng bên dưới. Muốn sửa gian hàng riêng từng dòng thì sửa trực tiếp
// ở ô Gian hàng của dòng đó.)
function xhDayFillHeader(items){
  const one=idx=>{const s=[...new Set(items.map(r=>r[idx]||''))];return s.length===1?s[0]:'';};
  document.getElementById('xhd-h-ngay').value=one(3)||xhDayCurrent||'';
  dmFillSelect(document.getElementById('xhd-h-dm'),one(6));
}
function renderXHDayDetail(){
  const wrap=document.getElementById('xh-day-tbl');
  if(!wrap)return;
  cleanupSearchLists(wrap);// dọn menu gợi ý cũ trước khi ghi đè innerHTML bên dưới
  const items=C.XH.filter(r=>(r[3]||'(chưa có ngày)')===xhDayCurrent);
  document.getElementById('xh-day-t').textContent='Phiếu xếp hàng ngày '+dVN(xhDayCurrent||'');
  const tongSL=items.reduce((s,r)=>s+Number(r[1]||0),0);
  const soGH=new Set(items.map(r=>r[2]).filter(Boolean)).size;
  const totalBar=document.getElementById('xh-day-total');
  totalBar.innerHTML=items.length?`<span>Số dòng: <b>${items.length}</b></span><span>Tổng SL: <b>${fmt(tongSL)}</b></span><span>Số gian hàng: <b>${soGH}</b></span>`:'';
  totalBar.style.display=items.length?'flex':'none';
  // Ô "Tìm nhanh trong phiếu" lọc dòng HIỂN THỊ theo tên sản phẩm hoặc tên gian hàng
  const q=(document.getElementById('xh-day-q')?.value||'').trim().toLowerCase();
  const shown=items.filter(r=>!q||(r[0]||'').toLowerCase().includes(q)||(r[2]||'').toLowerCase().includes(q));
  const rowHtml=r=>{
    const gi=C.XH.indexOf(r);const row=gi+2;
    const sp=C.TK.find(t=>t[0]===r[0]);
    const ton=sp?Number(sp[1]||0):null;
    const tonHtml=ton===null?'—':`<b style="color:${ton<=0?'#d03b3b':'var(--text)'}">${fmt(ton)}</b>`;
    return`<tr>
      <td><input id="xhd-sp-${row}" value="${esc(r[0])}" autocomplete="off" oninput="xhdFillTon('${row}')" style="min-width:170px"></td>
      <td id="xhd-ton-${row}" style="text-align:center;color:var(--text2);font-size:12px;white-space:nowrap">${tonHtml}</td>
      <td><input type="number" min="0" id="xhd-sl-${row}" value="${r[1]||0}" style="width:80px"></td>
      <td><input id="xhd-gh-${row}" value="${esc(r[2]||'')}" autocomplete="off" style="min-width:120px"></td>
      <td class="td-del"><button class="btn btn-d btn-sm" onclick="delXH(${row})">✕</button></td>
    </tr>`;
  };
  // Gộp các dòng đã có theo Gian hàng — mỗi gian hàng 1 bảng riêng, dễ theo dõi khi 1 ngày xếp cho nhiều gian hàng
  const groups=new Map();
  shown.forEach(r=>{
    const gh=r[2]||'(chưa có gian hàng)';
    if(!groups.has(gh))groups.set(gh,[]);
    groups.get(gh).push(r);
  });
  const ghNames=[...groups.keys()].sort((a,b)=>a==='(chưa có gian hàng)'?1:b==='(chưa có gian hàng)'?-1:a.localeCompare(b));
  const groupsHtml=ghNames.map(gh=>{
    const its=groups.get(gh);
    const slGroup=its.reduce((s,r)=>s+Number(r[1]||0),0);
    return`<div class="xhd-gh-group">
      <div class="xhd-gh-title">🏬 ${esc(gh)}<span class="acc-cnt">${its.length} dòng · SL: ${fmt(slGroup)}</span></div>
      <table class="item-table"><thead><tr><th>Sản phẩm</th><th>Tồn kho</th><th>Số lượng</th><th>Gian hàng</th><th></th></tr></thead><tbody>${its.map(rowHtml).join('')}</tbody></table>
    </div>`;
  }).join('');
  let emptyMsg='';
  if(!items.length)emptyMsg='<div class="empty">Không còn phiếu nào trong ngày này — bấm "+ Thêm sản phẩm" để thêm mới</div>';
  else if(!shown.length)emptyMsg=`<div class="empty">Không có dòng nào khớp với ô tìm</div>`;
  wrap.innerHTML=`<div class="scroll-tbl">${groupsHtml}
    <div class="xhd-gh-group"><div class="xhd-gh-title">➕ Dòng mới thêm</div>
      <table class="item-table"><thead><tr><th>Sản phẩm</th><th>Tồn kho</th><th>Số lượng</th><th>Gian hàng</th><th></th></tr></thead><tbody id="xh-day-new-tbody"></tbody></table>
    </div></div>`+emptyMsg;
  wrap.querySelectorAll('[id^="xhd-sp-"]').forEach(el=>attachSearchList(el,()=>C.TK.map(t=>t[0])));
  wrap.querySelectorAll('[id^="xhd-gh-"]').forEach(el=>attachSearchList(el,()=>C.GH.map(g=>g[0])));
}
// Thêm 1 dòng TRỐNG (chưa lưu) vào popup để xếp thêm sản phẩm mới cho đúng ngày này
let xhDayNewCount=0;
function addXHDayRow(){

// Hiện tồn kho hiện có của SP đang chọn ở dòng mới thêm trong popup theo ngày (giống modal Tạo phiếu xếp hàng)
function xhdFillTon(id){
  const spEl=document.getElementById('xhd-sp-'+id),cell=document.getElementById('xhd-ton-'+id);
  if(!spEl||!cell)return;
  const sp=C.TK.find(t=>t[0]===spEl.value.trim());
  if(sp){
    const t=Number(sp[1]||0);
    cell.innerHTML=`<b style="color:${t<=0?'#d03b3b':'var(--text)'}">${fmt(t)}</b>`;
    const slEl=document.getElementById('xhd-sl-'+id);if(slEl)slEl.max=t;
  }else cell.textContent='—';
}
// Tạo mới 1 dòng Xếp hàng (dùng cho dòng vừa "+ Thêm" trong popup theo ngày) — cùng logic trừ tồn kho như saveXH()
async function saveXHCreateCore(spIdx,sl,gh,ngay,gc,dm){
  const sp=C.TK[spIdx];
  if(!sp)return{ok:false,msg:'Chọn sản phẩm'};
  if(!sl||sl<=0)return{ok:false,msg:'Số lượng phải lớn hơn 0'};
  if(!gh)return{ok:false,msg:'Chọn gian hàng'};
  if(sl>Number(sp[1]||0))return{ok:false,msg:`${sp[0]}: tồn chỉ còn ${sp[1]}!`};
  dm=dm||'';
  await apiPost({sheet:'XepHang',action:'append',row:[sp[0],sl,gh,ngay,gc,sp[9]||'',dm]});
  const newSL=Math.max(0,Number(sp[1]||0)-sl);const upd=[...sp];upd[1]=newSL;// không để tồn âm
  await apiPost({sheet:'TonKho',action:'update',row:spIdx+2,data:upd});
  C.TK[spIdx][1]=newSL;
  C.XH.push([sp[0],sl,gh,ngay,gc,sp[9]||'',dm]);
  return{ok:true};
}
// Lưu tất cả các dòng đang sửa trong popup (cả dòng có sẵn lẫn dòng vừa "+ Thêm")
// Xóa cả phiếu (mọi dòng) của ngày đang xem trong popup — tiện hơn phải đóng popup rồi ra danh sách tick chọn
async function delXHDay(){
  const idxs=C.XH.map((r,i)=>i).filter(i=>(C.XH[i][3]||'(chưa có ngày)')===xhDayCurrent).sort((a,b)=>b-a);
  if(!idxs.length){toast('Không có phiếu nào để xóa','err');return;}
  confirmDel(`Xóa toàn bộ phiếu xếp ngày ${dVN(xhDayCurrent)} (${idxs.length} dòng)? Tồn kho sẽ được hoàn lại tương ứng.`,async()=>{
    toast('Đang xóa '+idxs.length+' dòng...');
    const delNames=[];
    for(const idx of idxs){
      const r=C.XH[idx];if(!r)continue;
      delNames.push(`${r[0]} x${r[1]}`);
      await apiPost({sheet:'XepHang',action:'delete',row:idx+2});
      const spIdx=xhTKIndex(r);
      if(spIdx>=0){
        const newSL=Number(C.TK[spIdx][1]||0)+Number(r[1]||0);
        const upd=[...C.TK[spIdx]];upd[1]=newSL;
        await apiPost({sheet:'TonKho',action:'update',row:spIdx+2,data:upd});
        C.TK[spIdx][1]=newSL;
      }
    }
    logAction('Xóa','Xếp hàng',`Xóa cả phiếu ngày ${dVN(xhDayCurrent)} (${delNames.length} dòng): ${delNames.join(', ')}`);
    toast('Đã xóa phiếu xếp ngày '+dVN(xhDayCurrent)+'!');
    cm('m-xh-day');
    setTimeout(loadXH,800);
  });
}
async function saveXHDayAll(){
  toast('Đang lưu...');
  const hNgay=document.getElementById('xhd-h-ngay').value;
  const hDm=document.getElementById('xhd-h-dm').value;
  const items=C.XH.filter(r=>(r[3]||'(chưa có ngày)')===xhDayCurrent);
  for(const r of items){
    const row=C.XH.indexOf(r)+2;
    const spEl=document.getElementById('xhd-sp-'+row);
    if(!spEl)continue;// dòng đã bị xóa khỏi DOM (bấm ✕) trong lúc sửa, bỏ qua
    const old=C.XH[row-2];
    const spIdx=C.TK.findIndex(t=>t[0]===spEl.value);
    const sl=Number(document.getElementById('xhd-sl-'+row).value||0);
    const rowGh=document.getElementById('xhd-gh-'+row)?.value.trim()||old[2]||'';
    const res=await saveXHEditCore(row,spIdx,sl,rowGh,hNgay||old[3]||'',old[4]||'',hDm||old[6]||'');
    if(!res.ok){toast(`Dòng "${r[0]}": ${res.msg}`,'err');return;}
  }
  const newTrs=[...document.querySelectorAll('#xh-day-tbl tbody tr[data-new="1"]')];
  const created=[];
  const nNgay=hNgay||(xhDayCurrent&&xhDayCurrent!=='(chưa có ngày)'?xhDayCurrent:td());
  const nDm=hDm||((C.XH.find(r=>(r[3]||'')===xhDayCurrent&&r[6])||[])[6]||'');
  for(const tr of newTrs){
    const id=tr.dataset.tempId;
    const spVal=document.getElementById('xhd-sp-'+id).value;
    const sl=Number(document.getElementById('xhd-sl-'+id).value||0);
    if(!spVal&&!sl)continue;// dòng để trống hoàn toàn (bấm + Thêm nhưng không gõ gì), bỏ qua
    const spIdx=C.TK.findIndex(t=>t[0]===spVal);
    const rowGh=document.getElementById('xhd-gh-'+id)?.value.trim()||'';
    const res=await saveXHCreateCore(spIdx,sl,rowGh,nNgay,'',nDm);
    if(!res.ok){toast(`Dòng mới: ${res.msg}`,'err');return;}
    created.push(`${C.TK[spIdx][0]} x${sl}`);
  }
  if(created.length)logAction('Tạo mới','Xếp hàng',`Thêm vào ngày ${dVN(xhDayCurrent)}: ${created.join(', ')}`);
  toast('Đã lưu tất cả thay đổi!');
  cm('m-xh-day');
  setTimeout(loadXH,800);
}

// ── XÓA XẾP HÀNG → hoàn lại tồn kho ──
async function delXH(row){
  const r=C.XH[row-2];if(!r)return;
  const tenSP=r[0],sl=Number(r[1]||0);
  confirmDel(`Xóa phiếu xếp "${tenSP}" (${sl})? Tồn kho sẽ được hoàn lại ${sl}.`,async()=>{
    toast('Đang xóa...');
    await apiPost({sheet:'XepHang',action:'delete',row:Number(row)});
    const spIdx=xhTKIndex(r);
    if(spIdx>=0){
      const newSL=Number(C.TK[spIdx][1]||0)+sl;
      const upd=[...C.TK[spIdx]];upd[1]=newSL;
      await apiPost({sheet:'TonKho',action:'update',row:spIdx+2,data:upd});
      C.TK[spIdx][1]=newSL;
    }
    logAction('Xóa','Xếp hàng',`Phiếu xếp "${tenSP}" x${sl}`);
    toast('Đã xóa & hoàn tồn kho!');setTimeout(loadXH,800);
  });
}

// KHÔNG dùng 1 bảng riêng cộng dồn dần (dễ thiếu dữ liệu cũ, dễ lệch) — mà TÍNH THẲNG từ lịch sử Xếp hàng
// (C.XH) mỗi lần hiển thị: gộp theo (Sản phẩm, Gian hàng) rồi cộng SL → tự động có đủ mọi phiếu xếp,

// mỗi dòng là 1 độ lệch (offset, có thể âm) cộng thêm vào số tính từ Xếp hàng, không phải số tuyệt đối.

bootPage('xh',function(){

});
